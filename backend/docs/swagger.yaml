basePath: /api/v1
definitions:
  handlers.CourseInput:
    properties:
      category_id:
        type: integer
      description:
        type: string
      duration:
        type: string
      image_url:
        type: string
      is_combo:
        type: boolean
      language:
        type: string
      price:
        type: number
      teacher_ids:
        items:
          type: string
        type: array
      title:
        type: string
    required:
    - title
    type: object
  handlers.LessonInput:
    properties:
      content:
        type: string
      order_index:
        type: integer
      program_id:
        type: string
      title:
        type: string
    required:
    - program_id
    - title
    type: object
  handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.ProgramInput:
    properties:
      course_id:
        type: string
      description:
        type: string
      image_url:
        type: string
      order_index:
        type: integer
      price:
        type: number
      teacher_ids:
        items:
          type: string
        type: array
      title:
        type: string
    required:
    - title
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      role:
        type: string
    required:
    - email
    - password
    type: object
  handlers.ReviewInput:
    properties:
      author_email:
        type: string
      author_name:
        type: string
      comment:
        type: string
      rating:
        maximum: 5
        minimum: 1
        type: integer
    required:
    - author_name
    - comment
    - rating
    type: object
  models.Category:
    properties:
      id:
        type: integer
      name:
        type: string
      order_index:
        type: integer
      slug:
        type: string
    type: object
  models.Company:
    properties:
      address:
        type: string
      courses_count:
        type: integer
      description:
        type: string
      email:
        type: string
      founded_year:
        type: integer
      id:
        type: integer
      logo_url:
        type: string
      mission:
        type: string
      name:
        type: string
      phone_number:
        type: string
      students_count:
        type: integer
      teachers_count:
        type: integer
    type: object
  models.Course:
    properties:
      average_rating:
        type: number
      category:
        $ref: '#/definitions/models.Category'
      category_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      duration:
        type: string
      id:
        type: string
      image_url:
        type: string
      is_combo:
        type: boolean
      language:
        description: ru | kz
        type: string
      lessons_count:
        type: integer
      price:
        type: number
      programs:
        items:
          $ref: '#/definitions/models.Program'
        type: array
      reviews_count:
        type: integer
      teachers:
        items:
          $ref: '#/definitions/models.Teacher'
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.Lesson:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      order_index:
        type: integer
      program_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.Program:
    properties:
      course_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      image_url:
        type: string
      lessons:
        items:
          $ref: '#/definitions/models.Lesson'
        type: array
      lessons_count:
        type: integer
      order_index:
        type: integer
      price:
        type: number
      teachers:
        items:
          $ref: '#/definitions/models.Teacher'
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.Review:
    properties:
      author_email:
        type: string
      author_name:
        type: string
      comment:
        type: string
      course_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_approved:
        type: boolean
      rating:
        type: integer
      updated_at:
        type: string
    type: object
  models.Teacher:
    properties:
      bio:
        type: string
      courses_count:
        type: integer
      created_at:
        type: string
      experience:
        description: years
        type: integer
      id:
        type: string
      name:
        type: string
      order_index:
        type: integer
      photo_url:
        type: string
      specialty:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
